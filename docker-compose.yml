# Инфраструктура pet-проекта: Kafka (+ веб-интерфейс), RustFS (S3) и ClickHouse.
# Airflow запускается отдельно, через profile, чтобы не занимать память без нужды.
#
# Шпаргалка (команды выполняются из папки проекта):
#   docker compose up -d       запустить всё, кроме Airflow
#   docker compose --profile airflow up -d   то же плюс Airflow
#   docker compose ps          статус контейнеров
#   docker compose logs -f kafka   логи одного сервиса (Ctrl+C — выйти)
#   docker compose stop        остановить, данные сохраняются
#   docker compose down        удалить контейнеры, volume'ы с данными остаются
#   docker compose down -v     удалить ВСЁ, включая данные Kafka, RustFS и ClickHouse
#
# Пароли и логины берутся из файла .env (он лежит рядом и не попадает в git).
# Запись ${S3_ACCESS_KEY} значит "подставь значение переменной из .env".

name: pet-pipeline

# ---------------------------------------------------------------- Airflow
# Общие настройки для всех сервисов Airflow. "&airflow-common" — якорь YAML:
# ниже сервисы подключают этот блок строкой "<<: *airflow-common",
# чтобы не повторять одно и то же пять раз.
# profiles: ["airflow"] — Airflow запускается, только если явно попросить:
#   docker compose --profile airflow up -d
x-airflow-common: &airflow-common
  build: ./airflow                 # собираем образ из airflow/Dockerfile
  image: pet-pipeline-airflow:latest
  profiles: ["airflow"]
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor          # задачи выполняются прямо в контейнере scheduler
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"           # без демонстрационных DAG'ов
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"   # новый DAG сначала на паузе
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"   # учебный стенд: вход без логина
    AIRFLOW__API_AUTH__JWT_SECRET: pet-pipeline-local-jwt-secret
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    # Настройки для наших джоб. Адреса — внутренние имена контейнеров,
    # а не localhost: задачи выполняются внутри сети Docker.
    S3_ENDPOINT: http://rustfs:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    CH_HOST: clickhouse
    CH_PORT: "8123"
    CLICKHOUSE_USER: ${CLICKHOUSE_USER}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  volumes:
    - ./airflow/dags:/opt/airflow/dags     # DAG'и из репозитория
    - ./jobs:/opt/airflow/jobs             # наши Spark-джобы
    - airflow_logs:/opt/airflow/logs       # логи задач
    - spark_ivy_cache:/home/airflow/.ivy2  # кэш jar-пакетов Spark: качаются один раз


services:

  # ------------------------------------------------------------------ Kafka
  # Брокер сообщений. Режим KRaft: один контейнер сам себе и брокер,
  # и контроллер кластера, отдельный Zookeeper не нужен.
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9094:9094"   # внешний вход: для кода из WSL, адрес localhost:9094
    environment:
      CLUSTER_ID: "pet-pipeline-kafka-01"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Три "входа" (listener'а) в Kafka:
      #   INTERNAL   :9092 — для других контейнеров (Airflow), адрес kafka:9092
      #   EXTERNAL   :9094 — для локального кода из WSL, адрес localhost:9094
      #   CONTROLLER :9093 — служебный, для управления кластером
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      # Адреса, которые Kafka сообщает клиентам: "дальше подключайся ко мне вот так".
      # Если тут ошибиться, клиент подключится, но не сможет читать и писать.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Брокер один, поэтому служебные топики хранятся в одной копии.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Новые топики по умолчанию создаются с 3 партициями.
      KAFKA_NUM_PARTITIONS: 3
      # Где Kafka хранит сообщения. Папка подключена к volume ниже,
      # поэтому топики и сообщения переживают пересоздание контейнера.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Ограничиваем память Java-процесса Kafka (по умолчанию он берет 1 ГБ).
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # Kafka считается здоровой, когда отвечает на запрос списка топиков.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # --------------------------------------------------------------- Kafka UI
  # Веб-интерфейс для Kafka: топики, партиции, сообщения, consumer group'ы.
  # Открывается в браузере: http://localhost:8082
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    container_name: kafka-ui
    ports:
      - "8082:8080"   # внутри контейнера 8080, снаружи 8082: порт 8080 позже займет Airflow
    environment:
      KAFKA_CLUSTERS_0_NAME: pet-pipeline
      # UI — тоже контейнер, поэтому ходит в Kafka по внутреннему адресу
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # ------------------------------------------------------------ RustFS (S3)
  # Локальная замена AWS S3 с тем же протоколом, поэтому код потом заработает
  # и с настоящим S3, если поменять адрес и ключи.
  # Изначально тут был MinIO, но он перестал публиковать Docker-образы.
  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: rustfs
    ports:
      - "9000:9000"   # S3 API — сюда ходят Spark и boto3
      - "9001:9001"   # веб-консоль: http://localhost:9001
    environment:
      # Логин и пароль берем из .env под общими именами S3_*:
      # коду не важно, какое именно S3-хранилище стоит за адресом.
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data   # файлы бакетов переживают перезапуск контейнера

  # ------------------------------------------------------------- ClickHouse
  # Колоночная аналитическая СУБД, здесь будут таблицы и метрики.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      # HTTP-порт: веб-редактор http://localhost:8123/play, clickhouse-connect, JDBC.
      # Нативный порт 9000 наружу не публикуем: на 9000 уже сидит RustFS,
      # а внутри сети Docker они друг другу не мешают.
      - "8123:8123"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      # ClickHouse держит открытыми много файлов одновременно.
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  # ------------------------------------------------------------ Airflow: БД
  # Postgres для служебных данных Airflow: история запусков, статусы задач
  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  # Одноразовый сервис: создает таблицы Airflow в Postgres и завершается
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command: airflow db migrate
    depends_on:
      airflow-postgres:
        condition: service_healthy

  # Веб-интерфейс и API: http://localhost:8080
  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: airflow api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Планировщик: решает, когда запускать задачи, и выполняет их (LocalExecutor)
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Читает файлы из dags/ и превращает их в DAG'и, которые видит планировщик
  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: airflow dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

# Именованные volume'ы: Docker хранит их отдельно от контейнеров.
volumes:
  kafka_data:
  rustfs_data:
  clickhouse_data:
  airflow_postgres_data:
  airflow_logs:
  spark_ivy_cache:
